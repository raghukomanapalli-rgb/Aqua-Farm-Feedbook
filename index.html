<div id="feeding-schedule">
  <h2>Feeding Schedule</h2>
  <button id="download-csv">Download CSV</button>
  <button id="download-pdf">Download PDF</button>
  <table>
    <thead>
      <tr>
        <th>Day</th>
        <th>Feed Amount</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
  const form = document.getElementById('feed-form');
  const feedingSchedule = document.querySelector('#feeding-schedule tbody');

  form.addEventListener('submit', function(event) {
    event.preventDefault();
    const seedCount = parseInt(document.getElementById('seed-count').value);
    const feedType = document.getElementById('feed-type').value;
    populateFeedingSchedule(seedCount, feedType);
  });

  function populateFeedingSchedule(seedCount, feedType) {
    feedingSchedule.innerHTML = '';
    const feedAmount = calculateFeedAmount(seedCount, feedType);
    for (let day = 1; day <= 120; day++) {
      const row = feedingSchedule.insertRow();
      row.insertCell(0).textContent = `Day ${day}`;
      row.insertCell(1).textContent = `${feedAmount} kg`;
    }
  }

  function calculateFeedAmount(seedCount, feedType) {
    let multiplier = 0.02;
    if (feedType === 'Higee Feeds') multiplier = 0.025;
    else if (feedType === 'CP') multiplier = 0.03;
    else if (feedType === 'Kaytee') multiplier = 0.022;
    else if (feedType === 'Srinivasa Feeds') multiplier = 0.021;
    else if (feedType === 'Heritage Feeds') multiplier = 0.024;
    else if (feedType === 'Krish Feeds') multiplier = 0.023;
    return (seedCount * multiplier).toFixed(2);
  }

  // 📥 Download CSV
  document.getElementById('download-csv').addEventListener('click', () => {
    let csvContent = "Day,Feed Amount\n";
    [...feedingSchedule.rows].forEach(row => {
      csvContent += `${row.cells[0].textContent},${row.cells[1].textContent}\n`;
    });
    const blob = new Blob([csvContent], { type: 'text/csv' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = "feeding_schedule.csv";
    link.click();
  });

  // 📄 Download PDF
  document.getElementById('download-pdf').addEventListener('click', () => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.text("Feeding Schedule", 10, 10);

    let y = 20;
    [...feedingSchedule.rows].forEach(row => {
      doc.text(`${row.cells[0].textContent} - ${row.cells[1].textContent}`, 10, y);
      y += 10;
    });

    doc.save("feeding_schedule.pdf");
  });
</script>
