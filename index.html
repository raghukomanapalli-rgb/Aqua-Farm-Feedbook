    <div id="feeding-schedule">
        <h2>21-Day Blind Feeding Schedule</h2>
        <table>
            <thead>
                <tr>
                    <th>Day</th>
                    <th>Feed Amount</th>
                </tr>
            </thead>
            <tbody>
                <!-- Schedule will be populated here -->
            </tbody>
        </table>
    </div>
    
    <script>
        const form = document.querySelector('form');
        form.addEventListener('submit', function(event) {
            event.preventDefault();
            const seedCount = parseInt(document.getElementById('seed-count').value);
            const feedType = document.getElementById('feed-type').value;
            populateFeedingSchedule(seedCount, feedType);
        });

        function populateFeedingSchedule(seedCount, feedType) {
            const feedingSchedule = document.getElementById('feeding-schedule').querySelector('tbody');
            feedingSchedule.innerHTML = '';
            const feedAmount = calculateFeedAmount(seedCount, feedType);
            for (let day = 1; day <= 21; day++) {
                const row = feedingSchedule.insertRow();
                const cellDay = row.insertCell(0);
                const cellAmount = row.insertCell(1);
                cellDay.textContent = `Day ${day}`;
                cellAmount.textContent = `${feedAmount} kg`;
            }
        }

        function calculateFeedAmount(seedCount, feedType) {
            // Example calculation logic based on feed type and seed count
            let multiplier = 0.02; // 2% of seed weight as feed
            if (feedType === 'Higee Feeds') multiplier = 0.025;
            else if (feedType === 'CP') multiplier = 0.03;
            else if (feedType === 'Kaytee') multiplier = 0.022;
            else if (feedType === 'Srinivasa Feeds') multiplier = 0.021;
            else if (feedType === 'Heritage Feeds') multiplier = 0.024;
            else if (feedType === 'Krish Feeds') multiplier = 0.023;
            return (seedCount * multiplier).toFixed(2);
        }
    </script>
