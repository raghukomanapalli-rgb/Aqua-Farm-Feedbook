<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Vannamei Farm Manager</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial;
margin:0;
background:#eef4f5;
}

header{
background:#00796b;
color:white;
padding:15px;
text-align:center;
}

.container{
padding:15px;
}

.card{
background:white;
padding:15px;
margin-bottom:15px;
border-radius:10px;
box-shadow:0 3px 6px rgba(0,0,0,0.15);
}

h2{
color:#00796b;
}

input,button,select{
width:100%;
padding:10px;
margin:5px 0;
}

button{
background:#00796b;
color:white;
border:none;
border-radius:5px;
}

.dashboard{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.metric{
background:#009688;
color:white;
padding:15px;
text-align:center;
border-radius:8px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
border:1px solid #ccc;
padding:8px;
text-align:center;
}

</style>

</head>

<body>

<header>

<h1>🦐 Vannamei Farm Manager</h1>

</header>

<div class="container">


<div class="card">

<h2>Pond Setup</h2>

<input id="pond" placeholder="Pond Name">

<input type="date" id="stock">

<input type="number" id="pl" placeholder="PL Count">

<button onclick="savePond()">Save Pond</button>

</div>


<div class="card">

<h2>Farm Dashboard</h2>

<div class="dashboard">

<div class="metric">

<h3 id="doc">0</h3>

DOC

</div>

<div class="metric">

<h3 id="feed">0</h3>

Feed kg

</div>

<div class="metric">

<h3 id="weight">0</h3>

Weight g

</div>

<div class="metric">

<h3 id="fcr">0</h3>

FCR

</div>

</div>

</div>



<div class="card">

<h2>Feed Log</h2>

<input id="feedInput" type="number" placeholder="Feed kg">

<button onclick="addFeed()">Add Feed</button>

<table id="feedTable">

<tr>

<th>Date</th>

<th>Feed</th>

</tr>

</table>

</div>



<div class="card">

<h2>Growth Sampling</h2>

<input id="growthInput" type="number" placeholder="Avg Weight g">

<button onclick="addGrowth()">Save</button>

<canvas id="growthChart"></canvas>

</div>



<div class="card">

<h2>Water Quality</h2>

<input id="ph" placeholder="pH">

<input id="do" placeholder="DO">

<input id="salinity" placeholder="Salinity">

<button onclick="addWater()">Save</button>

<table id="waterTable">

<tr>

<th>pH</th>

<th>DO</th>

<th>Salinity</th>

</tr>

</table>

</div>



<div class="card">

<h2>Expense Tracker</h2>

<input id="expName" placeholder="Item">

<input id="expAmount" placeholder="Amount">

<button onclick="addExpense()">Add</button>

<table id="expTable">

<tr>

<th>Item</th>

<th>Amount</th>

</tr>

</table>

</div>



<div class="card">

<h2>Profit Calculator</h2>

<input id="harvest" placeholder="Harvest kg">

<input id="price" placeholder="Price per kg">

<button onclick="profit()">Calculate</button>

<h3 id="result"></h3>

</div>


</div>



<script>

let totalFeed=0
let totalExpense=0

let weights=[]
let labels=[]


function savePond(){

let date=document.getElementById("stock").value

localStorage.setItem("stock",date)

updateDOC()

}

function updateDOC(){

let date=localStorage.getItem("stock")

if(!date)return

let start=new Date(date)

let today=new Date()

let doc=Math.floor((today-start)/(1000*60*60*24))

document.getElementById("doc").innerText=doc

}

updateDOC()



function addFeed(){

let feed=parseFloat(document.getElementById("feedInput").value)

totalFeed+=feed

document.getElementById("feed").innerText=totalFeed

let table=document.getElementById("feedTable")

let row=table.insertRow()

row.insertCell(0).innerText=new Date().toLocaleDateString()

row.insertCell(1).innerText=feed

calcFCR()

}



function addGrowth(){

let w=parseFloat(document.getElementById("growthInput").value)

weights.push(w)

labels.push("S"+weights.length)

document.getElementById("weight").innerText=w

chart.update()

calcFCR()

}



function calcFCR(){

let weight=document.getElementById("weight").innerText

let pl=document.getElementById("pl").value

if(weight>0 && pl>0){

let biomass=(weight*pl)/1000

let fcr=(totalFeed/biomass).toFixed(2)

document.getElementById("fcr").innerText=fcr

}

}



function addWater(){

let ph=document.getElementById("ph").value

let dox=document.getElementById("do").value

let sal=document.getElementById("salinity").value

let table=document.getElementById("waterTable")

let row=table.insertRow()

row.insertCell(0).innerText=ph

row.insertCell(1).innerText=dox

row.insertCell(2).innerText=sal

}



function addExpense(){

let name=document.getElementById("expName").value

let amount=parseFloat(document.getElementById("expAmount").value)

totalExpense+=amount

let table=document.getElementById("expTable")

let row=table.insertRow()

row.insertCell(0).innerText=name

row.insertCell(1).innerText=amount

}



function profit(){

let harvest=document.getElementById("harvest").value

let price=document.getElementById("price").value

let income=harvest*price

let p=income-totalExpense

document.getElementById("result").innerText="Profit ₹ "+p

}



let ctx=document.getElementById("growthChart")

let chart=new Chart(ctx,{

type:"line",

data:{

labels:labels,

datasets:[{

label:"Growth g",

data:weights,

borderWidth:3

}]

},

options:{responsive:true}

})

</script>

</body>

</html>
